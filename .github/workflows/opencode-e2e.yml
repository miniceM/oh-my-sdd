name: OpenCode E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  opencode-e2e:
    name: OpenCode E2E (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    env:
      OMS_OPENCODE_E2E: '1'
      OMS_MOCK_USER: ci
      OPENCODE_PACKAGE: opencode-ai
      OPENCODE_VERSION: 1.18.15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org
      - name: Put repository mocks first on PATH (POSIX)
        if: runner.os != 'Windows'
        run: echo "${{ github.workspace }}/scripts" >> "$GITHUB_PATH"
      - name: Put repository mocks first on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:GITHUB_WORKSPACE 'scripts')
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace=@cli-tools/oh-my-sdd-opencode
      - name: Sync OpenCode resources twice
        run: |
          npm run sync:opencode
          npm run sync:opencode
      - run: node --test __tests__/unit/opencode/resource-scripts.test.js
      - run: npm run test:e2e:opencode
      - name: Upload OpenCode E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-e2e-${{ matrix.os }}-node${{ matrix.node }}
          path: .e2e-artifacts
          include-hidden-files: true
          if-no-files-found: warn
